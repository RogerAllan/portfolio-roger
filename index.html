<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Roger Allan, Full-Stack Developer</title>
  <meta name="description" content="Roger Allan, desenvolvedor full-stack. Uma carta estelar do que eu construo: frontend, backend, coleta, dados e ML, IA, segurança e infraestrutura 24/7." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#040406" />
  <style>
    /* loader: inline para aparecer no primeiro quadro, antes do JS e do CSS principal.
       A singularidade do centro do mapa, procedural (WebGL puro, sem dependências):
       o disco de acreção esquenta e acelera conforme o progresso (--p, 0 a 1). */
    html, body { background: #040406; }
    .loader {
      position: fixed; inset: 0; z-index: 90; display: grid; place-content: center; justify-items: center;
      padding: 16px; background: #040406; color: #dfe6ee; text-align: center; overflow: hidden;
      font-family: 'Tektur Variable', 'Bahnschrift', 'Segoe UI', sans-serif;
      transition: opacity .9s ease .25s, visibility 0s linear 1.15s;
    }
    .ld-stage { position: relative; width: min(640px, 96vw, 74svh); aspect-ratio: 1; margin: -6svh 0 -5svh;
      transition: transform 1.1s cubic-bezier(.55, 0, .85, .35), opacity .9s ease .2s; }
    .ld-gl { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ld-num { position: absolute; inset: 0; display: grid; place-content: center; line-height: 1; }
    .ld-num b { font-weight: 700; font-size: clamp(30px, 6.4vw, 46px); font-stretch: calc(75% + var(--p, 0) * 50%);
      font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(255, 181, 71, calc(var(--p, 0) * .6)); }
    .ld-num small { font-size: .78rem; color: #a3abb6; margin-top: 3px; letter-spacing: .08em; }
    .ld-title, .ld-step { position: relative; z-index: 1; }
    .ld-title { margin: 0; font-size: clamp(16px, 2.2vw, 20px); font-stretch: 110%; letter-spacing: .04em; }
    .ld-step { margin: 8px 0 0; min-height: 1.5em; font-family: 'JetBrains Mono Variable', ui-monospace, Consolas, monospace; font-size: 13px; color: #a3abb6; }
    .loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader.done .ld-stage { transform: scale(2.6); opacity: 0; }
    .loader.done .ld-title, .loader.done .ld-step { opacity: 0; transition: opacity .3s; }
    @media (prefers-reduced-motion: reduce) { .loader, .ld-stage { transition: opacity .3s; } .loader.done .ld-stage { transform: none; } }
  </style>
</head>
<body class="booting loading">

<!-- carregamento: some só quando tudo (texturas, modelos, shaders) estiver pronto -->
<div class="loader" id="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="ldTitle" aria-describedby="ldStep">
  <div class="ld-stage" aria-hidden="true">
    <canvas class="ld-gl" id="ldGl"></canvas>
    <div class="ld-num"><b id="ldPct">0</b><small>%</small></div>
  </div>
  <p class="ld-title" id="ldTitle">Calibrando a carta estelar</p>
  <p class="ld-step" id="ldStep">Fontes do painel</p>
</div>
<script>
/* Singularidade procedural do loader: shader de tela cheia no canvas do palco.
   window.__ldGL.set(p) define a ignição (0 a 1); flare() dá o clarão final; stop() encerra. */
(function () {
  var cv = document.getElementById('ldGl');
  var gl = cv && cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
  if (!gl) return;
  var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var FS = [
    'precision highp float;',
    'uniform vec2 uRes;uniform float uT,uP,uF;',
    'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}',
    /* rampa de temperatura: vinho, laranja, âmbar, branco */
    'vec3 heat(float x){x=clamp(x,0.,1.4);vec3 c=mix(vec3(0.),vec3(.42,.03,.07),smoothstep(0.,.22,x));',
    'c=mix(c,vec3(1.,.3,.05),smoothstep(.18,.52,x));c=mix(c,vec3(1.,.7,.3),smoothstep(.48,.8,x));return mix(c,vec3(1.,.96,.9),smoothstep(.78,1.15,x));}',
    /* densidade do disco no plano dele: espiral com rotação kepleriana (mais rápida perto do centro) */
    'float disk(vec2 d,float spin){float r=length(d);float a=atan(d.y,d.x)+uT*spin/pow(max(r,.2),1.5)+2.4*log(max(r,.01));',
    'vec2 q=vec2(cos(a),sin(a))*r*3.;float v=fbm(q*1.7)*.62+fbm(q*5.+3.1)*.38;',
    'float band=smoothstep(.27,.33,r)*(1.-smoothstep(.55,.93,r));return v*v*1.9*band;}',
    'void main(){',
    ' vec2 uv=(gl_FragCoord.xy-.5*uRes)/(.5*min(uRes.x,uRes.y));',
    ' float ig=uP*uP*(3.-2.*uP);float R=.22;float r=length(uv);float spin=.18+ig*.55;',
    /* estrelas de fundo, deslocadas pela lente gravitacional */
    ' vec2 su=uv*(1.-R*R*1.7/max(r*r,.002));float st=step(.997,h(floor(su*110.)))*(.35+.65*h(floor(su*110.)+3.));',
    ' vec3 col=vec3(st)*.55*smoothstep(R*1.1,R*2.2,r);',
    /* disco inclinado: a frente (embaixo) passa diante do horizonte; o fundo (em cima) fica atrás */
    ' float sq=.3;vec2 dp=vec2(uv.x,uv.y/sq);float dr=length(dp);float d=disk(dp,spin);',
    ' float dop=1.+.6*clamp(-uv.x/max(dr,.08),-1.,1.);',
    ' float T=d*(1.3-dr)*dop;',
    ' vec3 cold=vec3(.32,.4,.55)*d*.22;',
    ' vec3 dc=mix(cold,heat(T*(.25+ig*1.05)),ig*.92+.08);',
    ' float front=step(uv.y,0.);',
    /* imagem lenteada do disco de trás: arco em volta do horizonte, mais forte em cima e embaixo */
    ' float aa=atan(uv.y,uv.x);float lr=exp(-pow((r-R*1.3)/.07,2.));',
    ' vec2 lp=vec2(cos(aa),sin(aa))*(.36+max(r-R,0.)*1.1);float ld=disk(lp,spin);',
    ' float lw=.35+.65*abs(sin(aa));vec3 lc=mix(vec3(.32,.4,.55)*ld*.12,heat((.3+ig*.75)*ld*1.3),ig*.92+.08)*lr*lw*1.5;',
    /* anel de fótons */
    ' float pr=exp(-pow((r-R*1.035)/.0065,2.))+.35*exp(-pow((r-R*1.06)/.02,2.));',
    ' vec3 pc=mix(vec3(.5,.6,.75)*.35,vec3(1.,.82,.55)*1.6,ig)*pr;',
    ' float hole=smoothstep(R*1.003,R*.985,r);',
    ' col=(col+dc*(1.-front)+lc+pc)*(1.-hole)+dc*front;',
    /* clarão final */
    ' col+=uF*(vec3(1.,.86,.65)*exp(-r*2.6)*2.2+vec3(1.)*uF*uF*.6);',
    ' col=1.-exp(-col*1.35);',
    ' col+=(h(gl_FragCoord.xy+fract(uT*7.))-.5)*.035;',
    /* vinheta: some antes da borda do canvas */
    ' vec2 e=abs(gl_FragCoord.xy/uRes*2.-1.);float vg=smoothstep(1.,.62,max(e.x,e.y))*smoothstep(1.15,.6,r);',
    /* canvas transparente com alfa pré-multiplicado: só o brilho aparece, o fundo é a própria página */
    ' vec3 c=max(col,0.)*vg;gl_FragColor=vec4(c,clamp(max(c.r,max(c.g,c.b)),0.,1.));}'
  ].join('\n');
  function sh(t, src) { var s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; }
  var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  var pg = gl.createProgram(); gl.attachShader(pg, vs); gl.attachShader(pg, fs); gl.linkProgram(pg);
  if (!gl.getProgramParameter(pg, gl.LINK_STATUS)) return;
  gl.useProgram(pg);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pg, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = { res: gl.getUniformLocation(pg, 'uRes'), t: gl.getUniformLocation(pg, 'uT'), p: gl.getUniformLocation(pg, 'uP'), f: gl.getUniformLocation(pg, 'uF') };
  var p = 0, f = 0, fTarget = 0, run = true, t0 = performance.now(), last = t0;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    if (!run) return;
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    f += (fTarget - f) * Math.min(1, dt * 4);
    var k = Math.min(devicePixelRatio || 1, 1.5), w = Math.round(cv.clientWidth * k), hh = Math.round(cv.clientHeight * k);
    if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; gl.viewport(0, 0, w, hh); }
    gl.uniform2f(U.res, w, hh);
    gl.uniform1f(U.t, reduce ? 0 : (now - t0) / 1000);
    gl.uniform1f(U.p, p);
    gl.uniform1f(U.f, f);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__ldGL = {
    set: function (v) { p = v; },
    flare: function () { fTarget = 1; },
    stop: function () { run = false; var x = gl.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); }
  };
})();
</script>

<canvas id="space" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div id="labels" class="labels" aria-hidden="true"></div>

<!-- abertura -->
<section class="boot" id="boot" aria-labelledby="bootName">
  <div class="boot-in">
    <h1 class="boot-name" id="bootName"><span class="logo" id="logo"><span class="logo-txt">Roger Allan</span></span></h1>
    <p class="boot-role" data-t="role"></p>
    <p class="boot-lead" data-t="lead"></p>
    <div class="boot-cta">
      <button type="button" class="engage" id="engage"><span data-t="start"></span></button>
      <button type="button" class="engage alt" id="summaryBoot"><span data-t="summaryBtn"></span></button>
    </div>
    <p class="boot-stats" data-t="surface"></p>
  </div>
</section>

<!-- HUD -->
<header class="hud-top">
  <button type="button" class="callsign" id="callsign">Roger Allan<small data-t="role"></small></button>
  <div class="hud-tools">
    <button type="button" class="hud-sum" id="summaryHud"><span data-t="summaryH"></span></button>
    <div class="lang" role="group" id="langGroup">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <button type="button" class="sound" id="soundBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /></svg>
      <span id="soundLabel"></span>
    </button>
  </div>
</header>

<nav class="nav" id="nav" aria-labelledby="navTitle">
  <h2 class="nav-title" id="navTitle" data-t="systems"></h2>
  <ol class="nav-list" id="navList"></ol>
  <p class="nav-mapped" id="mapped"></p>
  <p class="nav-hint" data-t="hint"></p>
</nav>

<aside class="dossier" id="dossier" aria-live="polite" hidden>
  <button type="button" class="back" id="backBtn"><span data-t="back"></span></button>
  <div class="d-body" id="dBody"></div>
</aside>

<!-- modo lista (sem WebGL ou com menos movimento) -->
<main class="flat" id="flat" hidden></main>

<div class="cutscene" id="cutscene" hidden>
  <video playsinline muted preload="auto"></video>
  <p class="cs-title"></p>
  <span class="cs-stamp"></span>
  <button type="button" class="cs-skip"></button>
</div>
<div class="impact" id="impact" aria-hidden="true"><span class="ono" id="ono"></span></div>
<div class="toast" id="toast" role="status"></div>

<noscript><p class="noscript">Este portfólio precisa de JavaScript para a navegação.</p></noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
